name: EAI offline unit and CLI smoke
on:
  push:
    branches: [feature/local-first-mvp]
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q eai tests
      - name: Offline unit + fake E2E checks
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (no Ollama call)
        run: |
          python -m eai --version
          python -m eai health
      - name: Build and independently verify unsigned offline candidate
        run: |
          python -c "from pathlib import Path; Path('dist').mkdir(exist_ok=True)"
          python scripts/build_customer_candidate.py --output dist/EAI-Offline-Review-0.1.0-beta.zip
          python scripts/verify_customer_candidate.py --archive dist/EAI-Offline-Review-0.1.0-beta.zip --checksum dist/EAI-Offline-Review-0.1.0-beta.zip.sha256
      - name: Upload synthetic offline review candidate (NOT retail)
        uses: actions/upload-artifact@v4
        with:
          name: eai-offline-review-synthetic-beta
          path: |
            dist/EAI-Offline-Review-0.1.0-beta.zip
            dist/EAI-Offline-Review-0.1.0-beta.zip.sha256
          if-no-files-found: error
          retention-days: 7
