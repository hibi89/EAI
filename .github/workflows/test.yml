name: EAI offline unit and CLI smoke
on:
  push:
    branches: [feature/local-first-mvp, feature/eai-v32-owner-rebuild-20261119]
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q eai tests scripts
      - name: P2 static analysis on offline source (pinned, no customer data)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: ruff==0.14.10 mypy==1.18.2
          python -m ruff check --select E9,F63,F7,F82,E714,E731,E402 eai tests scripts
          python -m ruff check --select E701,E702 eai scripts
          python -m mypy --python-version 3.11 --follow-imports=normal --explicit-package-bases --ignore-missing-imports --check-untyped-defs eai scripts
      - name: P2 optional Ed25519 safety test dependency (runner only)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: V3.2 Tk GUI regression under virtual display (NOT physical Windows)
        run: |
          command -v xvfb-run
          timeout 180s xvfb-run -a python -m unittest discover -s tests -p 'test_desktop_workstation.py' -v
      - name: Offline unit + fake E2E checks
        run: python -m unittest discover -s tests -v
      - name: V3.2 source-only offline desktop entry self-check
        run: |
          python scripts/eai_desktop_entry.py --self-check --report "${RUNNER_TEMP}/eai-v32-source-check.json"
          python -c "import json,os; p=json.load(open(os.environ['RUNNER_TEMP']+'/eai-v32-source-check.json', encoding='utf-8')); assert p['status']=='PASS_SOURCE_IMPORTS_ONLY' and p['native_gui_e2e']=='NOT_RUN' and p['real_player']=='NOT_RUN'"
      - name: CLI smoke (no Ollama call)
        run: |
          python -m eai --version
          python -m eai health
      - name: Build and independently verify unsigned offline candidate
        run: |
          python -c "from pathlib import Path; Path('dist').mkdir(exist_ok=True)"
          python scripts/build_customer_candidate.py --output dist/EAI-Offline-Review-0.1.0-beta.zip
          python scripts/verify_customer_candidate.py --archive dist/EAI-Offline-Review-0.1.0-beta.zip --checksum dist/EAI-Offline-Review-0.1.0-beta.zip.sha256
      - name: Upload synthetic offline review candidate (NOT retail)
        uses: actions/upload-artifact@v4
        with:
          name: eai-offline-review-synthetic-beta
          path: |
            dist/EAI-Offline-Review-0.1.0-beta.zip
            dist/EAI-Offline-Review-0.1.0-beta.zip.sha256
          if-no-files-found: error
          retention-days: 7
