name: EAI offline unit and CLI smoke
on:
  push:
    branches: [feature/local-first-mvp]
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q eai tests
      - name: Offline unit + fake E2E checks
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (no Ollama call)
        run: |
          python -m eai --version
          python -m eai health
