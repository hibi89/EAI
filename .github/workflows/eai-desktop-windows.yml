name: EAI Windows Desktop Development EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline desktop syntax and isolated tests
        shell: pwsh
        run: |
          python -m compileall -q eai scripts/eai_desktop_entry.py tests/test_desktop_bridge.py
          python -m unittest discover -s tests -p "test_desktop*.py" -v
      - name: Build unsigned Windows GUI binary
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.17.0
          python -m PyInstaller --noconfirm --clean scripts/eai_desktop.spec
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: EAI-Windows-Unsigned-Development
          path: dist/EAI.exe
          if-no-files-found: error
          retention-days: 7
